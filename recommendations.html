<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOJOH | Recommended datasets</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="pages.css">
<link rel="stylesheet" href="nav.css">
<link rel="stylesheet" href="kojoh-ui.css">
<script src="nav.js"></script>
</head>
<body>

<header class="page-header">
  <span class="page-title">Recommended</span>
</header>

<main class="page-wrap">
  <div class="page-lead">
    <h1>For your job track</h1>
    <p id="recSub">Ranked using the professions you picked at signup and the KOJOH job-title ontology, not an AI black box.</p>
  </div>

  <div id="recResults"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="config.js"></script>
<script src="icons.js"></script>
<script>
  var LIVE = !!(window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase);
  var SUPA = LIVE ? window.kojohSupa() : null;
  var el = document.getElementById('recResults');
  var subEl = document.getElementById('recSub');
  el.innerHTML = window.kojohSkeleton('list');

  function empty(icon, title, body){
    el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">' + icon + '</div><h3>' + title + '</h3><p>' + body + '</p></div>';
  }
  function escape(s){ return String(s || '').replace(/[<>&"]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]; }); }

  async function load(){
    if (!LIVE) { empty(kIcon('plug'), 'Preview mode', 'Connect Supabase to load recommendations.'); return; }
    var s = await SUPA.auth.getSession();
    if (!s.data.session) { empty(kIcon('lock'), 'Sign in required', 'Please <a href="auth.html">log in</a> so we can tailor recommendations to your job tracks.'); return; }
    var uid = s.data.session.user.id;

    var pjt = await SUPA.from('profile_job_titles').select('job_title_id, job_titles(name)').eq('profile_id', uid);
    if (pjt.error) { empty(kIcon('alert'), 'Could not load your tracks', pjt.error.message); return; }
    var jobs = (pjt.data || []).map(function(r){ return r.job_titles && r.job_titles.name; }).filter(Boolean);
    if (!jobs.length) {
      empty(kIcon('target'), 'Pick your job tracks first', 'Head to <a href="settings.html#profile">settings</a> to set your interested professions. Recommendations key off those.');
      return;
    }
    subEl.innerHTML = 'Based on your tracks: <strong>' + escape(jobs.join(', ')) + '</strong>. <a href="settings.html#profile">Change them</a>';

    var jobIds = (pjt.data || []).map(function(r){ return r.job_title_id; });
    var djt = await SUPA.from('dataset_job_titles').select('dataset_id, datasets(id, title, short_description, price, is_free, difficulty, preview_rows, slug)').in('job_title_id', jobIds);
    if (djt.error) { empty(kIcon('alert'), 'Could not load datasets', djt.error.message); return; }

    var seen = {};
    var rows = (djt.data || []).filter(function(r){ if (!r.datasets || seen[r.datasets.id]) return false; seen[r.datasets.id] = 1; return true; });
    if (!rows.length) { empty(kIcon('inbox'), 'No datasets yet', 'No datasets have been tagged for your tracks yet. The catalog is still being seeded. Check back soon.'); return; }
    var extra = await Promise.all([window.kojohOwned(), window.kojohShelf()]);
    var owned = extra[0] || {}, shelf = extra[1] || {};
    var fresh = rows.filter(function(r){ return !owned[r.datasets.id]; });
    var mine = rows.filter(function(r){ return owned[r.datasets.id]; });
    var h = '';
    if (fresh.length) {
      h += '<div class="k-dsgrid">' + fresh.map(function(r){ return window.kojohDsCard(r.datasets, { shelf: shelf[r.datasets.id] }); }).join('') + '</div>';
    } else {
      h += '<div class="empty-state" style="margin-bottom:1.5rem;"><div class="empty-state-icon">' + kIcon('star') + '</div><h3>You have every match already</h3>'
        + '<p>Nice. New projects for your tracks show up here first. <a href="search.html">Browse the whole shelf</a> in the meantime.</p></div>';
    }
    if (mine.length) {
      h += '<h2 class="section-title" style="margin:2rem 0 0.9rem;font-size:1.05rem;">Already in your library</h2>';
      h += '<div class="k-dsgrid">' + mine.map(function(r){ return window.kojohDsCard(r.datasets, { owned: true }); }).join('') + '</div>';
    }
    el.innerHTML = h;
  }
  window.kReady(load);
</script>
</body>
</html>
