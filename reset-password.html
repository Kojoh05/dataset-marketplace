<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KOJOH | Reset password</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>

  <header class="auth-header">
    <a href="index.html" class="brand">KOJOH</a>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">

      <h2 style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.25rem;margin-bottom:0.35rem;">Reset your password</h2>
      <p style="font-size:0.8125rem;color:var(--muted);margin-bottom:1.25rem;line-height:1.5;">
        Enter your email and we'll send you a 6-digit code you can use to set a new password.
      </p>

      <!-- STEP 1: Email -->
      <div id="stepRequest">
        <label class="field-label">Email</label>
        <input type="email" id="rpEmail" class="auth-input" placeholder="you@example.com" autocomplete="email">
        <div class="auth-error" id="rpRequestError"></div>
        <button type="button" class="auth-submit" onclick="sendCode()">Send code</button>
      </div>

      <!-- STEP 2: OTP + new password -->
      <div id="stepVerify" hidden>
        <label class="field-label">6-digit code</label>
        <input type="text" id="rpCode" class="auth-input" placeholder="123456" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
        <p class="field-hint" id="rpCodeSentTo"></p>

        <label class="field-label" style="margin-top:1.1rem;">New password</label>
        <input type="password" id="rpNewPw" class="auth-input" placeholder="Create a new password" autocomplete="new-password">
        <ul class="pw-checklist" id="rpPwChecklist">
          <li id="rpPwLen">At least 8 characters</li>
          <li id="rpPwUpper">One uppercase letter</li>
          <li id="rpPwNum">One number</li>
          <li id="rpPwSpecial">One special character (@, #, !, …)</li>
        </ul>

        <div class="auth-error" id="rpVerifyError"></div>
        <button type="button" class="auth-submit" onclick="verifyCode()">Set new password</button>
        <p class="auth-switch" style="margin-top:0.75rem;">
          Didn't get the code? <a href="#" onclick="resendCode(event)">Resend</a>
        </p>
      </div>

      <p class="auth-switch">Remembered it? <a href="auth.html">Log in</a></p>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script>
    var LIVE = !!(window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase);
    var SUPA = LIVE ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY) : null;
    var pendingEmail = null;

    async function sendCode(){
      var err = document.getElementById('rpRequestError');
      err.textContent = '';
      var email = document.getElementById('rpEmail').value.trim();
      if (!email) { err.textContent = 'Enter your email.'; return; }
      if (!LIVE) { err.textContent = 'Preview mode. Connect Supabase to enable this.'; return; }
      var res = await SUPA.auth.resetPasswordForEmail(email);
      if (res.error) { err.textContent = res.error.message; return; }
      pendingEmail = email;
      document.getElementById('rpCodeSentTo').textContent = 'Sent to ' + email;
      document.getElementById('stepRequest').hidden = true;
      document.getElementById('stepVerify').hidden = false;
    }

    async function resendCode(e){
      e && e.preventDefault();
      if (!pendingEmail || !LIVE) return;
      await SUPA.auth.resetPasswordForEmail(pendingEmail);
    }

    // Password checklist
    document.getElementById('rpNewPw').addEventListener('input', function(){
      var v = this.value;
      document.getElementById('rpPwLen').classList.toggle('met', v.length >= 8);
      document.getElementById('rpPwUpper').classList.toggle('met', /[A-Z]/.test(v));
      document.getElementById('rpPwNum').classList.toggle('met', /[0-9]/.test(v));
      document.getElementById('rpPwSpecial').classList.toggle('met', /[^A-Za-z0-9]/.test(v));
    });

    async function verifyCode(){
      var err = document.getElementById('rpVerifyError');
      err.textContent = '';
      var code = document.getElementById('rpCode').value.trim();
      var newPw = document.getElementById('rpNewPw').value;
      if (!/^\d{6}$/.test(code)) { err.textContent = 'Enter the 6-digit code.'; return; }
      var pwValid = newPw.length >= 8 && /[A-Z]/.test(newPw) && /[0-9]/.test(newPw) && /[^A-Za-z0-9]/.test(newPw);
      if (!pwValid) { err.textContent = 'New password doesn\'t meet all requirements.'; return; }
      if (!LIVE || !pendingEmail) { err.textContent = 'Session lost. Please start again.'; return; }

      // Verify the recovery OTP. This issues a session for the user.
      var vres = await SUPA.auth.verifyOtp({ email: pendingEmail, token: code, type: 'recovery' });
      if (vres.error) { err.textContent = vres.error.message || 'Invalid or expired code.'; return; }

      var upd = await SUPA.auth.updateUser({ password: newPw });
      if (upd.error) { err.textContent = upd.error.message; return; }
      try { sessionStorage.setItem('kojoh_skip_welcome', '1'); } catch(e){}
      window.location.href = 'index.html';
    }
  </script>
<script src="forms.js"></script>
</body>
</html>
