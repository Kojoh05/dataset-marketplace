<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KOJOH | Folder</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="pages.css">
<link rel="stylesheet" href="nav.css">
<link rel="stylesheet" href="kojoh-ui.css">
<script src="nav.js"></script>
</head>
<body>

<header class="page-header">
  <span class="page-title" id="fdPageTitle">Folder</span>
</header>

<main class="page-wrap">
  <div id="fdRoot">
    <div class="empty-state"><div class="empty-state-icon"></div><h3>Loading</h3><p>One moment.</p></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="config.js"></script>
<script src="icons.js"></script>
<script>
(function(){
  var LIVE = !!(window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase);
  var SUPA = LIVE ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY) : null;
  var root = document.getElementById('fdRoot');

  function esc(s){
    return String(s === null || s === undefined ? '' : s)
      .replace(/[<>&"]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]; });
  }
  function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function nf(n){ return Number(n).toLocaleString('en-IN'); }
  function empty(icon, title, body){
    root.innerHTML = '<div class="empty-state"><div class="empty-state-icon">' + icon + '</div><h3>' + esc(title) + '</h3><p>' + body + '</p></div>';
  }

  function buildHero(count){
    var COLS = 6, W = 800, X0 = 4, SLOT = (W - X0 * 2) / COLS;
    var heights = [26, 44, 34, 58, 40, 50];
    var s = '<svg class="k-hero-svg" viewBox="0 0 800 96" preserveAspectRatio="none" role="img" aria-label="Decorative animation of stacked project folders">';
    s += '<g fill="currentColor">';
    for (var c = 0; c < COLS; c++) {
      var x = X0 + c * SLOT;
      var w = SLOT * 0.78;
      var tabW = w * 0.42;
      var bodyH = heights[c];
      var y = 86 - bodyH;
      s += '<g class="k-hero-row" style="animation-delay:' + (c * 0.11).toFixed(2) + 's">';
      s += '<rect x="' + x.toFixed(1) + '" y="' + (y - 7) + '" width="' + tabW.toFixed(1) + '" height="8" rx="2.5" opacity="' + (c === 0 ? '0.85' : '0.22') + '"/>';
      s += '<rect x="' + x.toFixed(1) + '" y="' + y + '" width="' + w.toFixed(1) + '" height="' + bodyH + '" rx="4" opacity="' + (c === 0 ? '0.85' : '0.18') + '"/>';
      s += '</g>';
    }
    s += '<rect class="k-hero-caret" x="' + (X0 + 5.6 * SLOT).toFixed(1) + '" y="88" width="2" height="2" rx="1" opacity="0.9"/>';
    s += '</g></svg>';
    return '<div class="k-hero">' + s +
           '<div class="k-hero-sweep"></div>' +
           '<div class="k-hero-foot"><span class="k-hero-live"><span class="k-hero-livedot"></span>Job track</span>' +
           '<span>' + count + (count === 1 ? ' project' : ' projects') + ' inside</span></div></div>';
  }

  function observeReveal(){
    var items = document.querySelectorAll('.k-reveal');
    if (!('IntersectionObserver' in window)) {
      Array.prototype.forEach.call(items, function(el){ el.classList.add('k-in'); });
      return;
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (e.isIntersecting) { e.target.classList.add('k-in'); io.unobserve(e.target); }
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
    Array.prototype.forEach.call(items, function(el){ io.observe(el); });
  }

  async function load(){
    var slug = new URLSearchParams(window.location.search).get('slug') || 'data-analyst';
    if (!LIVE) { empty(kIcon('plug'), 'Preview mode', 'Connect Supabase to browse folders.'); return; }

    var fRes = await SUPA.from('folders').select('*').eq('slug', slug).maybeSingle();
    if (fRes.error) { empty(kIcon('alert'), 'Could not load', esc(fRes.error.message)); return; }
    if (!fRes.data) { empty(kIcon('search'), 'Folder not found', 'That track does not exist yet. <a href="index.html#categories">Back to all folders</a>.'); return; }
    var folder = fRes.data;

    document.getElementById('fdPageTitle').textContent = folder.title;
    window.kojohSeo({
      title: folder.seo_title || ('KOJOH | ' + folder.title),
      description: folder.seo_description || folder.description,
      keywords: folder.seo_keywords,
      image: folder.og_image_url
    });

    var dRes = await SUPA.from('datasets').select('*').eq('folder_id', folder.id);
    if (dRes.error) { empty(kIcon('alert'), 'Could not load datasets', esc(dRes.error.message)); return; }
    var rows = dRes.data || [];

    var html = '';
    html += '<div class="page-lead"><h1>' + esc(folder.title) + '</h1>';
    html += '<p>' + esc(folder.description || '') + '</p></div>';

    html += buildHero(rows.length);

    html += '<div class="k-chiprow">';
    html += '<span class="k-chip k-chip-brand">' + rows.length + (rows.length === 1 ? ' dataset' : ' datasets') + '</span>';
    html += '<span class="k-chip">Every one is a real business problem</span>';
    html += '</div>';

    if (!rows.length) {
      html += '<div class="empty-state"><div class="empty-state-icon">' + kIcon('folder') + '</div>'
           +  '<h3>Nothing in here yet</h3><p>This track is still being built. Check back soon.</p></div>';
      root.innerHTML = html;
      return;
    }

    html += '<div class="k-dsgrid">';
    rows.forEach(function(d){
      var pv = d.preview_rows || null;
      var price = d.is_free ? 'Free' : ('&#8377;' + Number(d.price).toFixed(0));
      html += '<a class="k-dscard k-reveal" href="dataset.html?slug=' + encodeURIComponent(d.slug) + '">';
      html += '  <div class="k-dscard-top">';
      if (d.difficulty) html += '<span class="k-chip k-chip-brand">' + esc(cap(d.difficulty)) + '</span>';
      if (pv && pv.total_rows) {
        html += '<span class="k-chip">' + nf(pv.total_rows) + ' rows</span>';
        html += '<span class="k-chip">' + pv.columns.length + ' cols</span>';
      }
      html += '  </div>';
      html += '  <h3 class="k-dscard-title">' + esc(d.title) + '</h3>';
      html += '  <p class="k-dscard-desc">' + esc(d.short_description || '') + '</p>';
      html += '  <div class="k-dscard-foot"><span class="k-dscard-price">' + price + '</span>';
      html += '  <span class="k-dscard-go">Open project &rarr;</span></div>';
      html += '</a>';
    });
    html += '</div>';

    root.innerHTML = html;
    observeReveal();
  }

  window.kReady(load);
})();
</script>
</body>
</html>
