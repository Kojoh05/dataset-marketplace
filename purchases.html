<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KOJOH — Your purchases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="pages.css">
</head>
<body data-theme="light">

<header class="page-header">
  <a href="index.html" class="page-back" aria-label="Back to home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></a>
  <span class="page-title">Your purchases</span>
  <a href="index.html" class="page-brand">KOJOH</a>
</header>

<main class="page-wrap">
  <div class="page-lead">
    <h1>Purchased datasets</h1>
    <p>Everything you've bought lives here — click through to re-download any file you own.</p>
  </div>

  <div id="purchaseResults"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="config.js"></script>
<script>
  var LIVE = !!(window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase);
  var SUPA = LIVE ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY) : null;
  var el = document.getElementById('purchaseResults');

  function empty(icon, title, body){
    el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">' + icon + '</div><h3>' + title + '</h3><p>' + body + '</p></div>';
  }
  function escape(s){ return String(s || '').replace(/[<>&"]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]; }); }

  async function load(){
    if (!LIVE) { empty('🔌', 'Preview mode', 'Connect Supabase to see your purchases.'); return; }
    var s = await SUPA.auth.getSession();
    if (!s.data.session) { empty('🔒', 'Sign in required', 'Please <a href="auth.html">log in</a> to see your purchases.'); return; }
    var res = await SUPA.from('purchases').select('dataset_id, price_paid, purchased_at, datasets(title, short_description, slug)').order('purchased_at', { ascending: false });
    if (res.error) { empty('⚠️', 'Could not load', res.error.message); return; }
    var rows = (res.data || []).filter(function(r){ return r.datasets; });
    if (!rows.length) { empty('🛒', 'No purchases yet', 'Free datasets don\'t count here — this page shows paid datasets you own. Once you buy one it lives here for re-download.'); return; }
    el.innerHTML = '<div class="ds-list">' + rows.map(function(r){
      var d = r.datasets;
      var paid = r.price_paid ? '₹' + r.price_paid + ' paid' : 'Free';
      return '<div class="ds-item"><div class="ds-item-info"><div class="ds-item-title">' + escape(d.title) + '</div><div class="ds-item-sub">' + escape(d.short_description || '') + ' · ' + paid + '</div></div></div>';
    }).join('') + '</div>';
  }
  document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
