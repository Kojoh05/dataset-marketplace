<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOJOH | Search datasets</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="pages.css">
<link rel="stylesheet" href="nav.css">
<link rel="stylesheet" href="kojoh-ui.css">
<script src="nav.js"></script>
</head>
<body>

<header class="page-header">
  <span class="page-title">Search datasets</span>
</header>

<main class="page-wrap">
  <div class="page-lead">
    <h1>Find the right dataset</h1>
    <p>Search by role, tool or business problem. Results are ranked by job titles and tags, so "SQL" finds projects that need SQL, not just ones that mention it.</p>
  </div>

  <div class="page-search-wrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted);flex-shrink:0;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" class="page-search-input" id="searchInput" placeholder="Try 'sales', 'SQL' or 'data engineer'" autocomplete="off" enterkeyhint="search" aria-label="Search datasets">
    <button class="k-search-clear" id="searchClear" type="button" aria-label="Clear search">&#215;</button>
  </div>

  <div class="k-suggest" id="searchSuggest">
    <span class="k-suggest-label">Popular</span>
    <button class="k-fchip" type="button" data-q="Data analyst">Data analyst</button>
    <button class="k-fchip" type="button" data-q="SQL">SQL</button>
    <button class="k-fchip" type="button" data-q="Python">Python</button>
    <button class="k-fchip" type="button" data-q="Power BI">Power BI</button>
    <button class="k-fchip" type="button" data-q="Sales">Sales</button>
    <button class="k-fchip" type="button" data-q="Logistics">Logistics</button>
  </div>

  <div id="searchResults"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="config.js"></script>
<script src="icons.js"></script>
<script>
(function(){
  var LIVE = !!(window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase);
  var SUPA = LIVE ? window.kojohSupa() : null;
  var esc = window.kojohEsc;
  var results = document.getElementById('searchResults');
  var input = document.getElementById('searchInput');
  var clear = document.getElementById('searchClear');
  var debounce = null, seq = 0;
  var CATALOG = null, OWNED = {}, SHELF = {};

  function grid(rows, meta){
    var h = meta ? '<p class="k-resultmeta">' + meta + '</p>' : '';
    h += '<div class="k-dsgrid">';
    rows.forEach(function(d){ h += window.kojohDsCard(d, { owned: OWNED[d.id], shelf: SHELF[d.id] }); });
    return h + '</div>';
  }
  function noMatch(q){
    results.innerHTML = '<div class="empty-state"><div class="empty-state-icon">' + kIcon('search') + '</div>'
      + '<h3>Nothing for "' + esc(q) + '" yet</h3>'
      + '<p>The catalogue is still growing. Tell us what you were looking for and we will prioritise it.</p>'
      + '<div class="k-btnrow" style="justify-content:center;">'
      + '<a class="k-btn k-btn-brand" href="suggestions.html?topic=' + encodeURIComponent(q) + '">Request this dataset</a>'
      + '<button class="k-btn" type="button" id="searchShowAll">Show everything</button></div></div>';
    var all = document.getElementById('searchShowAll');
    if (all) all.addEventListener('click', function(){ setQuery(''); });
  }
  function browseAll(){
    if (!CATALOG) { results.innerHTML = window.kojohSkeleton('list'); return; }
    if (!CATALOG.length) {
      results.innerHTML = '<div class="empty-state"><div class="empty-state-icon">' + kIcon('folder') + '</div><h3>The shelf is being stocked</h3><p>New datasets land here soon.</p></div>';
      return;
    }
    results.innerHTML = grid(CATALOG, 'Everything on the shelf, newest first. Type above to narrow it down.');
  }
  function syncUrl(q){
    try {
      var url = window.location.pathname + (q ? '?q=' + encodeURIComponent(q) : '');
      window.history.replaceState(window.history.state, '', url);
    } catch (e) {}
  }
  function markChips(q){
    Array.prototype.forEach.call(document.querySelectorAll('#searchSuggest .k-fchip'), function(b){
      b.classList.toggle('on', q && b.getAttribute('data-q').toLowerCase() === q.toLowerCase());
    });
  }

  // Record what people look for, so the admin dashboard can show demand
  // that the catalogue is not serving yet. Failures are ignored on purpose.
  var logged = {};
  function logSearch(q, count){
    if (!LIVE || !q || q.length > 120 || logged[q]) return;
    logged[q] = true;
    SUPA.auth.getSession().then(function(r){
      var uid = r.data && r.data.session ? r.data.session.user.id : null;
      SUPA.from('search_log').insert({ query: q, results_count: count, user_id: uid }).then(function(){}, function(){});
    });
  }

  function run(q){
    clear.classList.toggle('show', !!q);
    markChips(q);
    syncUrl(q);
    clearTimeout(debounce);
    if (!q) { browseAll(); return; }
    if (!LIVE) { results.innerHTML = '<div class="empty-state"><h3>Preview mode</h3><p>Search is not connected.</p></div>'; return; }
    results.innerHTML = window.kojohSkeleton('list');
    var my = ++seq;
    debounce = setTimeout(function(){
      SUPA.rpc('search_datasets', { query: q }).then(function(res){
        if (my !== seq) return;
        if (res.error) {
          results.innerHTML = '<div class="empty-state"><h3>Search hit a snag</h3><p>' + esc(res.error.message) + '</p></div>';
          return;
        }
        var hits = res.data || [];
        logSearch(q, hits.length);
        if (!hits.length) { noMatch(q); return; }
        var byId = {};
        (CATALOG || []).forEach(function(d){ byId[d.id] = d; });
        var rows = hits.map(function(h){
          var id = h.dataset_id || h.id;
          return byId[id] || { id: id, slug: h.slug, title: h.title, short_description: h.short_description };
        });
        results.innerHTML = grid(rows, rows.length + (rows.length === 1 ? ' match' : ' matches') + ' for "' + esc(q) + '"');
      });
    }, 260);
  }
  function setQuery(q){ input.value = q; run(q); if (!q) input.focus(); }

  input.addEventListener('input', function(){ run(this.value.trim()); });
  input.addEventListener('keydown', function(e){ if (e.key === 'Escape' && input.value) { e.preventDefault(); setQuery(''); } });
  clear.addEventListener('click', function(){ setQuery(''); });
  Array.prototype.forEach.call(document.querySelectorAll('#searchSuggest .k-fchip'), function(b){
    b.addEventListener('click', function(){
      var q = b.getAttribute('data-q');
      setQuery(input.value.trim().toLowerCase() === q.toLowerCase() ? '' : q);
    });
  });

  function load(){
    var q = (new URLSearchParams(window.location.search).get('q') || '').trim();
    input.value = q;
    results.innerHTML = window.kojohSkeleton('list');
    if (!LIVE) { run(q); return; }
    Promise.all([
      SUPA.from('datasets').select('id, slug, title, short_description, price, is_free, difficulty, preview_rows, created_at').order('created_at', { ascending:false }),
      window.kojohOwned(),
      window.kojohShelf()
    ]).then(function(r){
      CATALOG = (r[0] && r[0].data) || [];
      OWNED = r[1] || {};
      SHELF = r[2] || {};
      run(input.value.trim());
    });
    if (!q && window.matchMedia && window.matchMedia('(min-width: 721px)').matches) input.focus();
  }
  window.kReady(load);
})();
</script>
</body>
</html>
