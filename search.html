<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KOJOH | Search datasets</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="pages.css">
<link rel="stylesheet" href="nav.css">
<script src="nav.js"></script>
</head>
<body>

<header class="page-header">
  <span class="page-title">Search datasets</span>
</header>

<main class="page-wrap">
  <div class="page-lead">
    <h1>Find the right dataset</h1>
    <p>Search by role (Data Analyst), tool (SQL, Python), or business domain (logistics, sales). Results are ranked by an ontology of job titles + tags, no AI black box.</p>
  </div>

  <div class="page-search-wrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted);"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" class="page-search-input" id="searchInput" placeholder="e.g. 'churn analysis' or 'SQL logistics'" autocomplete="off">
  </div>

  <div id="searchResults"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="config.js"></script>
<script src="icons.js"></script>
<script>
  var LIVE = !!(window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase);
  var SUPA = LIVE ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY) : null;
  var results = document.getElementById('searchResults');
  var searchInput = document.getElementById('searchInput');
  var searchDebounce = null;

  function emptyState(msg){
    results.innerHTML = '<div class="empty-state"><div class="empty-state-icon">' + kIcon('search') + '</div><h3>No matches</h3><p>' + msg + '</p></div>';
  }
  function initialState(){
    results.innerHTML = '<div class="empty-state"><div class="empty-state-icon">' + kIcon('bulb') + '</div><h3>Start typing</h3><p>Try a role like <em>data engineer</em>, a tool like <em>Power BI</em>, or a domain like <em>e-commerce</em>. The catalog is still growing, so early searches may return no results.</p></div>';
  }
  function renderResults(rows){
    if (!rows || !rows.length) { emptyState('Nothing matched that query yet. The catalog is still being seeded, so try a broader term.'); return; }
    results.innerHTML = '<div class="ds-list">' + rows.map(function(r){
      return '<div class="ds-item"><div class="ds-item-info"><div class="ds-item-title">' + escape(r.title) + '</div><div class="ds-item-sub">' + escape(r.short_description || '') + '</div></div></div>';
    }).join('') + '</div>';
  }
  function escape(s){ return String(s || '').replace(/[<>&"]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]; }); }

  initialState();
  searchInput.addEventListener('input', function(){
    var q = this.value.trim();
    clearTimeout(searchDebounce);
    if (!q) { initialState(); return; }
    if (!LIVE) { emptyState('Search backend not connected (preview mode).'); return; }
    searchDebounce = setTimeout(function(){
      SUPA.rpc('search_datasets', { query: q }).then(function(res){
        if (res.error) { emptyState('Search error: ' + res.error.message); return; }
        renderResults(res.data);
      });
    }, 300);
  });
</script>
</body>
</html>
