<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>KOJOH | Certificate</title>
<meta name="robots" content="noindex">
<script>(function(){var q=new URLSearchParams(location.search);if(q.get("embed"))document.documentElement.classList.add("cert-embed");})();</script>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Montserrat:wght@400;500;600;700;800;900&family=Mrs+Saint+Delafield&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="pages.css">
<link rel="stylesheet" href="nav.css">
<link rel="stylesheet" href="kojoh-ui.css">
<script src="nav.js"></script>
<style>
.cert-wrap{max-width:62rem; margin:0 auto 4rem; padding:0 1.25rem;}
.cert-tools{display:flex; gap:0.5rem; justify-content:flex-end; flex-wrap:wrap; margin:0 0 1rem;}
.cert{position:relative; aspect-ratio:297/210; width:100%; background:#fff; color:#141317; border-radius:6px; box-shadow:0 10px 40px rgba(0,0,0,0.14);
  overflow:hidden; container-type:inline-size; font-family:'Montserrat', 'Space Grotesk', sans-serif;}
.px{position:absolute; width:3.8cqw; height:3.8cqw;}
.cert-in{position:absolute; inset:0 0 15cqw 0; display:flex; flex-direction:column; align-items:center; text-align:center; padding:5.6cqw 16cqw 0; z-index:1; overflow:hidden;}
.c-logo{height:6.6cqw; width:auto;}
.c-big{font-weight:900; font-size:8.2cqw; line-height:0.95; letter-spacing:-0.1cqw; margin-top:2cqw;}
.c-sub{font-weight:500; font-size:2.1cqw; letter-spacing:1.25cqw; margin-top:1cqw; padding-left:1.25cqw;}
.c-pre{font-weight:700; font-size:1.6cqw; letter-spacing:0.08cqw; margin-top:3.2cqw;}
.c-name{font-weight:800; font-size:5.6cqw; line-height:1.15; margin-top:1.6cqw; letter-spacing:-0.08cqw;}
.c-line{width:21cqw; height:0.12cqw; background:#141317; margin:1.8cqw 0 1.7cqw;}
.c-what{font-weight:400; font-size:1.65cqw; line-height:1.45; max-width:70cqw;}
.c-what b{font-weight:700;}
.c-tools{font-weight:500; font-size:1.45cqw; letter-spacing:0.28cqw; color:#6b6870; margin-top:1.2cqw;}
.c-foot{position:absolute; left:15.5cqw; right:15.5cqw; bottom:5.6cqw; display:flex; justify-content:space-between; align-items:flex-end; z-index:1;}
.c-cell{min-width:18cqw; text-align:center;}
.c-cell .v{font-weight:800; font-size:1.65cqw; padding-bottom:0.9cqw; border-bottom:0.12cqw solid #141317; text-transform:uppercase;}
.c-cell .k{font-weight:600; font-size:1.25cqw; letter-spacing:0.2cqw; margin-top:1cqw; text-transform:uppercase;}
.c-sig{font-family:'Mrs Saint Delafield', 'Great Vibes', cursive; font-size:4.6cqw; line-height:0.8; padding-bottom:0.3cqw; border-bottom:0.12cqw solid #141317;}
.c-mid{text-align:center;}
.c-qr{width:6cqw; height:6cqw; margin:0 auto 0.5cqw; background:#fff;}
.c-qr img, .c-qr canvas{width:100% !important; height:100% !important;}
.c-id{font-size:0.95cqw; letter-spacing:0.1cqw; color:#6b6870;}
.cert-note{font-size:0.875rem; color:var(--muted); text-align:center; margin-top:1rem;}
html.cert-embed, html.cert-embed body{background:transparent !important; margin:0 !important; padding:0 !important; overflow:hidden;}
html.cert-embed .ksb-rail, html.cert-embed .ksb-edge, html.cert-embed .ksb-overlay, html.cert-embed .ksb-mobile-trigger, html.cert-embed .page-header,
html.cert-embed .cert-tools, html.cert-embed .cert-note, html.cert-embed .k-legal-foot, html.cert-embed footer{display:none !important;}
html.cert-embed .cert-wrap{max-width:none; margin:0; padding:0;}
html.cert-embed .cert{border-radius:0; box-shadow:none;}
@media print{
  @page{size:A4 landscape; margin:0;}
  body, body.ksb-has-rail, body.ksb-has-rail.ksb-expanded{background:#fff !important; padding:0 !important; margin:0 !important;}
  .ksb-rail, .ksb-edge, .ksb-mobile-trigger, .k-legal-foot, .page-header, .cert-tools, .cert-note, .k-footer, footer, .ksb-overlay{display:none !important;}
  .cert-wrap{max-width:none; margin:0; padding:0;}
  .cert{width:297mm; height:210mm; border-radius:0; box-shadow:none; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
}
</style>
</head>
<body>
<header class="page-header"><span class="page-title">Certificate</span></header>
<main class="cert-wrap" id="certApp"><p class="cert-note">Loading certificate</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  // pixel corners: [col, row, shade] counted from that corner, 3.8cqw cells
  var D = '#141317', M = '#4a484e', G = '#7d7b80', L = '#acaaad', P = '#eeedee';
  var TL = [[0,0,P],[2,0,M],[3,0,G],[4,0,L],[0,1,G],[1,1,L],[3,1,D],[0,2,D],[2,2,P],[0,3,P],[3,4,P],[0,5,P],[1,6,P]];
  var TR = [[0,0,L],[1,0,G],[2,0,D],[0,1,P],[1,1,M],[3,1,L],[0,2,G],[0,3,L],[1,3,D],[0,4,G],[2,4,P],[1,5,P],[1,6,P],[2,7,P],[1,8,P]];
  var BL = [[0,0,L],[2,0,G],[0,1,G],[1,1,L],[0,2,D],[1,2,P],[2,3,P],[1,4,P],[0,5,P],[2,5,P],[1,6,P]];
  var BR = [[0,0,G],[1,0,L],[1,1,D],[0,1,G],[2,1,P],[0,2,M],[1,2,P],[2,3,P],[0,4,P],[1,5,P],[0,6,P]];
  var h = '', S = 3.8, O = 2.5;
  function put(list, xk, yk) { list.forEach(function (q) { h += '<div class="px" style="' + xk + ':' + (O + q[0] * S) + 'cqw;' + yk + ':' + (O + q[1] * S) + 'cqw;background:' + q[2] + '"></div>'; }); }
  put(TL, 'left', 'top'); put(TR, 'right', 'top'); put(BL, 'left', 'bottom'); put(BR, 'right', 'bottom');
  window.KOJOH_PIXELS = h;
})();
(async function () {
  var app = document.getElementById('certApp'), esc = window.kojohEsc;
  var code = (new URLSearchParams(location.search).get('id') || '').trim().toUpperCase();
  function fail(m) { app.innerHTML = '<div class="empty-state"><h3>Certificate not found</h3><p>' + esc(m) + '</p></div>'; }
  if (!/^KJ-[A-Z0-9]{8}$/.test(code)) return fail('Check the certificate ID. It looks like KJ-1A2B3C4D.');
  var r = await window.kojohSupa().from('practice_certificates').select('code, name, role, role_title, level, skipped, score, issued_at, status').eq('code', code).eq('status', 'issued').maybeSingle();
  if (r.error || !r.data) return fail('There is no issued certificate with ID ' + code + '.');
  var c = r.data, isProject = c.level === 'project', lvName = { beginner: 'Beginner', intermediate: 'Intermediate', hard: 'Hard', project: 'Portfolio project' }[c.level] || c.level;
  var role = c.role_title || c.role.replace(/-/g, ' ').replace(/\b\w/g, function (x) { return x.toUpperCase(); });
  var url = 'https://www.kojohhi.com/certificate?id=' + c.code;
  var issued = new Date(c.issued_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();
  var title = isProject ? role : role + ' Practice, ' + lvName + ' Level';
  var what = isProject
    ? 'For successfully completing the data project <b>' + esc(String(role).split(': ')[0]) + '</b>, reviewed by the KOJOH team.'
    : (c.skipped ? 'For unlocking the <b>' + esc(lvName) + ' level</b> of KOJOH Practice for <b>' + esc(role) + '</b>.'
                 : 'For completing the <b>' + esc(lvName) + ' level</b> of KOJOH Practice for <b>' + esc(role) + '</b>, with a final score of <b>' + c.score + '%</b>.');
  document.title = 'KOJOH | ' + c.name + ', ' + title;
  app.innerHTML = '<div class="cert-tools"><button class="k-btn" type="button" id="cCopy">Copy link</button>'
    + '<a class="k-btn" target="_blank" rel="noopener" href="https://www.linkedin.com/profile/add?startTask=CERTIFICATION_NAME&name=' + encodeURIComponent(isProject ? 'KOJOH Portfolio Project: ' + role : 'KOJOH Practice: ' + role + ', ' + lvName) + '&organizationName=KOJOH&issueYear=' + new Date(c.issued_at).getFullYear() + '&issueMonth=' + (new Date(c.issued_at).getMonth() + 1) + '&certUrl=' + encodeURIComponent(url) + '&certId=' + c.code + '">Add to LinkedIn</a>'
    + '<button class="k-btn k-btn-brand" type="button" onclick="window.print()">Download PDF</button></div>'
    + '<div class="cert lv-' + esc(c.level) + '" id="cert">' + window.KOJOH_PIXELS
    + '<div class="cert-in"><img class="c-logo" src="/assets/cert/kojoh-wordmark-dark.png" alt="KOJOH">'
    + '<div class="c-big">CERTIFICATE</div><div class="c-sub">' + (isProject ? 'OF ACHIEVEMENT' : 'OF COMPLETION') + '</div>'
    + '<div class="c-pre">THIS CERTIFICATE IS PRESENTED TO</div><div class="c-name">' + esc(c.name) + '</div><div class="c-line"></div>'
    + '<div class="c-what">' + what + '</div><div class="c-tools" id="cTools">SQL &middot; Python &middot; Excel &middot; Power BI</div></div>'
    + '<div class="c-foot"><div class="c-cell"><div class="v">' + issued + '</div><div class="k">Date</div></div>'
    + '<div class="c-mid"><div class="c-qr" id="cQr"></div><div class="c-id">ID ' + esc(c.code) + '</div></div>'
    + '<div class="c-cell"><div class="c-sig">Danzai</div><div class="k">Founder, KOJOH</div></div></div></div>'
    + '<p class="cert-note">Anyone can verify this certificate at ' + esc(url) + '</p>';
  try { new QRCode(document.getElementById('cQr'), { text: url, width: 256, height: 256, colorDark: '#141317', colorLight: '#FFFFFF', correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
  if (isProject) {
    try {
      var tg = await window.kojohSupa().from('datasets').select('dataset_tags(tags(name, tag_type))').eq('slug', c.role).maybeSingle();
      var tools = ((tg.data && tg.data.dataset_tags) || []).map(function (x) { return x.tags; }).filter(function (t) { return t && t.tag_type === 'tool'; }).map(function (t) { return t.name; });
      if (tools.length) document.getElementById('cTools').innerHTML = tools.map(esc).join(' &middot; ');
    } catch (e) {}
  }
  if (new URLSearchParams(location.search).get('print')) {
    var go = function () { setTimeout(function () { window.print(); }, 400); };
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(go);
  }
  document.getElementById('cCopy').onclick = function () { try { navigator.clipboard.writeText(url); this.textContent = 'Copied'; } catch (e) {} };
})();
</script>
</body>
</html>
